# Keeps the scheduled indexer running indefinitely.
# GitHub disables scheduled workflows after 60 days without repository activity. Calling the "enable workflow" API
# resets that timer (the method used by gautamkrishnar/keepalive-workflow v2 and liskin/gh-workflow-keepalive),
# without dummy commits. Runs weekly and re-enables all scheduled workflows, including itself.
name: keepalive

on:
  schedule:
    - cron: "17 3 * * 1"           # every Monday 03:17 UTC
  workflow_dispatch: {}

permissions:
  actions: write                   # only to call the enable-workflow API on this repository

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Re-enable the scheduled workflows (resets the 60-day inactivity timer)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for wf in index.yml backup.yml keepalive.yml; do
            gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${wf}/enable"
            echo "re-enabled ${wf}"
          done
